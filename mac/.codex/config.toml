# このフォルダで Codex を起動したときの推奨設定。
#
# 注意 1: このファイルはフォルダを「信頼」したときにだけ読み込まれる。
#   初回起動時に "Do you trust the contents of this directory?" と聞かれるので、
#   自分で受け取ったフォルダであれば "Yes, continue" を選ぶこと。
#   信頼しなかった場合、この設定・フック・exec ポリシーは読み込まれない。
#   （スキルは `.agents/skills` 配下にあり、読み込みに信頼が必要という記述は公式ドキュメントには無い）
#
# 注意 2: このファイルを編集したら、Codex を一度終了して起動し直すこと。
#   設定はセッションの起動時に一度だけ読み込まれる。

# このフォルダで使う権限プロファイル。
# 組み込みの :workspace を土台にしている（このフォルダの中と一時ディレクトリへの書き込みを許可）。
# これがないと、Git 管理下でないフォルダでは read-only での起動が推奨されるため、
# 導入確認の `command -v sf` にも承認が必要になることがある。
default_permissions = "digiman-sf-onboarding"

[permissions.digiman-sf-onboarding]
description = "Salesforce CLI オンボーディング用。フォルダ内の読み書きは自動、外に出るときだけ確認する。"
extends = ":workspace"

# --- ネットワークを許可したい場合だけ、下の 2 行の行頭の # を消す ---
#
# 既定ではネットワークはオフで、Salesforce CLI のインストール時に毎回承認を求められる。
# 下を有効にすると、このフォルダのエージェントだけが確認なしに外部へ通信できるようになる。
#
# ただし、これを有効にしてもフォルダの外への書き込み
# （npm のグローバル領域など）の承認は残るため、承認が完全に無くなるわけではない。
#
# [permissions.digiman-sf-onboarding.network]
# enabled = true

# --- 補足 ---
# Codex には、旧来の sandbox_mode / sandbox_workspace_write / approval_policy という
# 設定系もあるが、上の権限プロファイルとは併用できない（どちらか一方だけ）。
# このフォルダでは新しい権限プロファイル側に統一している。
# お使いの Codex が古くてこの設定が効かない場合は、設定なしでも動作する。
# その場合は、インストール時に表示される承認をその都度許可すればよい。
